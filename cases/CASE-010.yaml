case_id: CASE-010
title: 不存在的第七码头箱
briefing: |
  临港保税仓的夜间盘点中，稽核员夏澜发现系统里多出一个“已入库、已称重、已封存”的进口设备箱 C7-441，但实际库位上没有这个箱子。
  她在准备冻结相关放行单时失联，次日被发现死在 7 号库装卸平台后方。仓储协调员袁升声称系统只是历史同步错误，自己 22:00 后一直在值班室。
  然而地磅、集装箱封条、叉车定位和海关接口日志显示：有人用另一个真实箱子的重量与封条信息拼出了一个“幽灵箱”，并在深夜尝试把对应付款放行。
  这是前十案中信息量最大的一案：需要先证明 C7-441 从未真正入库，再证明谁制造了它，最后解释夏澜为何会在 7 号库与袁升发生冲突。
scene:
  - id: S1
    title: 7 号库位 C7-441 标牌
    content: |
      货架系统显示 C7-441 应位于 7-B-16，但现场该库位为空，地面长期积尘连续，没有近期放置大型木箱留下的矩形压痕。
      旁边电子标签仍显示“已封存 / 1280 kg / Seal QX7719”。
  - id: S2
    title: 7 号库装卸平台
    content: |
      平台边缘有一段被叉车轮压碎的塑料封条，能读出尾号 7719。碎片内侧印有“二次打印”字样，说明它不是原厂一次性封条。
      平台护栏有新鲜刮擦，附近散落一枚夏澜稽核终端的保护壳卡扣。
  - id: S3
    title: 夏澜的手持稽核终端
    content: |
      终端在平台排水沟旁找到，屏幕停留在“冻结放行：C7-441”页面。离线缓存显示 22:37 做过一次人工备注：
      “重量抄 C7-418，封条也不是原件。先锁单，找袁升。”备注没有成功同步到中心系统。
  - id: S4
    title: 叉车 F-12
    content: |
      F-12 左侧货叉有一小片蓝色标签胶，颜色与 C7 系列电子标签背胶一致；车轮沾有 7 号库平台特有的黄色防滑砂。
      叉车电源已关闭，但车载定位模块仍保存夜间轨迹缓存。
  - id: S5
    title: 值班室碎纸机收集袋
    content: |
      收集袋中能拼出一部分“临港旧档迁移服务验收单”，供应商为“栖鸦档案整理有限公司”，项目联系人陆闻川，旧合同编号 KY-0417。
      文件签署时间是 2011 年，远早于本案；它被夹在仓库旧接口改造资料中，不能证明陆闻川参与当前幽灵箱操作。
  - id: S6
    title: 真实货箱 C7-418
    content: |
      C7-418 正常存放在 6 号库，实际称重 1280 kg，原厂封条号 QX7719。箱体、封条与入库照片一致，没有被打开。
      这两个关键字段与幽灵箱 C7-441 完全相同，而正常情况下不同货箱不应共用同一原厂封条号。
npcs:
  - id: P1
    name: 袁升
    testimony: |
      我负责夜间仓储协调。C7-441 肯定是老系统同步出来的重复数据，夏澜太紧张了。我 22:00 后都在值班室处理日报，没有去 7 号库。
      F-12 是公共叉车，谁都能开；封条信息也是报关行传进来的，我没有权限改海关数据。
  - id: P2
    name: 夏弋
    testimony: |
      我是叉车司机。21:50 交班后我把 F-12 停在充电位，钥匙挂回值班室钥匙板。22:20 袁升说要“挪一个错库位的箱子”，拿走了 F-12 钥匙。
      我提醒他夜里没有司机配合，他说只是空车定位，不用我去。第二天钥匙已经挂回原处。
  - id: P3
    name: 叶筱
    testimony: |
      我是海关接口运维。C7-441 的入库消息不是海关正式报文，而是仓库内部“历史补录”接口生成的兼容消息。
      这个接口只允许仓储协调员和系统管理员使用。案发当晚系统管理员账号处于锁定维护状态。
  - id: P4
    name: 邱明
    testimony: |
      我是夜班保安。22:42 左右看见夏澜从值班区快步往 7 号库走，袁升隔了不到一分钟跟过去。
      23:05 我巡到装卸平台，那里没有人，但 F-12 停在平台侧边，后来 23:20 再看时叉车已经回充电位。
  - id: P5
    name: 贺鸣
    testimony: |
      我负责财务放行。C7-441 对应一笔 86 万元设备代采尾款，正常要等实物验收。袁升当晚 22:31 催我先放行，说“箱子已经进库，只是标签还没同步”。
      我没有放款，因为夏澜同时发消息让我冻结这单。
  - id: P6
    name: 沈罗
    testimony: |
      我是系统管理员。袁升一个月前问过我历史补录接口能不能“补一个漏掉的箱子”，我告诉他只能在有纸质入库单时使用。
      他账号本身有权限，但每次调用都会写审计日志。我没有帮他修改过日志。
archive:
  - id: A1
    title: C7-441 历史补录接口审计
    keywords: ["C7-441", "历史补录", "袁升", "22:09"]
    content: |
      22:09:13，账号 yuan-sheng 调用 legacy-inbound 创建 C7-441；请求体中重量 1280、封条 QX7719、库位 7-B-16。
      22:11:02 同账号手工确认“实物已验”。系统管理员账号当晚未登录。
  - id: A2
    title: 地磅原始称重流水
    keywords: ["1280", "C7-418", "地磅", "C7-441"]
    content: |
      当日只有一笔 1280 kg 的有效称重，发生在 14:26，对应真实货箱 C7-418。22:00 后地磅没有任何车辆或货物过磅。
      C7-441 系统记录中的“1280 kg”没有对应原始称重流水。
  - id: A3
    title: F-12 叉车定位缓存
    keywords: ["F-12", "7号库", "22:44", "袁升"]
    content: |
      F-12 22:43 从充电位启动，22:45 到达 7 号库平台，23:12 离开，23:18 返回充电位。启动时驾驶员登录使用临时主管码 SUP-YS。
      SUP-YS 绑定袁升。普通叉车司机使用个人工号，不使用主管码。
  - id: A4
    title: 值班室终端活动记录
    keywords: ["袁升", "值班室", "22:41", "23:19"]
    content: |
      袁升账号 22:40:51 锁定值班室终端，23:19:34 才再次解锁。期间日报没有任何编辑活动。
      因此其“22:00 后一直在值班室处理日报”的说法与本机活动不符。
  - id: A5
    title: C7-441 付款与供应商关系
    keywords: ["86万", "付款", "袁升", "供应商"]
    content: |
      C7-441 对应供应商“启舟设备贸易”，实际控制人是袁升的表兄。该供应商此前两笔订单均有实物入库，本次 86 万元尾款首次使用“历史补录”方式触发验收。
      这提供经济动机，但不应单独作为杀人结论。
truth:
  culprit: 袁升
  method: 袁升用本人有权限的历史补录接口创建并不存在的 C7-441，抄用真实货箱 C7-418 的 1280 kg 重量和 QX7719 封条号制造“已入库”假象，以推动关联供应商的 86 万元尾款；夏澜识破重复字段并准备冻结放行后，袁升取走 F-12 叉车前往 7 号库与其冲突并将其杀害，之后把叉车送回充电位并继续否认离开值班室
  key_evidence: ["S3", "S6", "P2", "P4", "A1", "A2", "A3", "A4"]
  method_required_terms: ["C7-441", "C7-418", "1280", "QX7719", "历史补录", "F-12"]
  supporting_evidence: ["S1", "S2", "S4", "P2", "P3", "P4", "P5", "P6", "A5"]
