case_id: CASE-007
title: 凌晨两点的药柜
briefing: |
  私立医院夜间药房在 02:17 发现药师何知微死亡。她当晚正在复核急诊药柜的季度盘点，系统却显示一名已经下班的实习护士在 01:51 进入药房，
  随后又有一名主管级账号打开受管制药柜。护理组长蒋岑声称自己整晚都在五层病区处理病人呼叫，从未去过地下药房。
  现场没有强行开柜痕迹，但何知微的盘点单、混合身份认证记录和一枚断裂的工牌卡套把三个不同人的身份交织在了一起。
  本案重点不是判断“谁的工牌出现过”，而是还原门禁卡、个人 PIN 与实际人在场之间的区别。
scene:
  - id: S1
    title: 急诊药柜 E-4
    content: |
      E-4 柜门完好，电子锁没有撬动痕迹。柜内两个用于急诊处置的受管制镇静药包装位为空，但系统盘点表显示白班交接时数量完整。
      柜门旁贴有提示：开柜必须先由药房门禁放行，再输入个人六位 PIN；两套身份记录彼此独立。
  - id: S2
    title: 何知微的盘点单
    content: |
      盘点单连续圈出过去六周 5 次“夜间急诊领用后补录”，领用科室均写五层护理单元，其中 3 次缺少医生补签。
      最后一行写着：“找蒋岑核清，今晚 E-4 再少就直接报审计。”
  - id: S3
    title: 药房地面的断裂卡套
    content: |
      配药台旁有一枚透明工牌卡套的断角，卡套上残留蓝色圆点贴纸。医院统一卡套无贴纸，蓝点是五层护理组为区分主管备用卡自贴的标识。
      断角边缘很新，与门边一处细小刮痕高度接近。
  - id: S4
    title: 地下员工更衣区的雨伞架
    content: |
      蒋岑的黑色折伞放在地下更衣区伞架，伞面有 01:30 后室外降雨形成的新鲜水珠；她声称 01:00 后一直没有离开五层病区。
      地下药房与员工停车场入口相连，从五层通过内部电梯下行约两分钟。
  - id: S5
    title: 配药台旁的文件袋
    content: |
      何知微的透明文件袋中装有五层护理组的夜间领药复印件，最早一张右上角盖着灰色鸦羽样式的“旧档复核”章。
      该复印件来自十年前纸档数字化批次，与本案当晚药柜操作无直接关系。
npcs:
  - id: P1
    name: 林可
    testimony: |
      我是实习护士，工牌号 N-308。01:10 下班后我在更衣室发现工牌不见了，以为落在护士站。
      01:45 左右我已经在回家地铁上，刷交通卡和同事聊天记录都能对上。我没有药柜 E-4 的个人 PIN 权限，实习生也不能独立领那类药。
  - id: P2
    name: 蒋岑
    testimony: |
      我是五层护理组长。01:20 到 02:10 我都在五层处理两个病房呼叫，没有下楼。何知微经常因为补录问题找护理组麻烦，但这是流程问题。
      林可工牌丢了就应该先查她自己。E-4 的主管 PIN 很多人知道，我从没把备用卡带到药房。
  - id: P3
    name: 赵医生
    testimony: |
      我 01:32 在五层处理过一次病人呼叫，蒋岑当时在场；但 01:40 后情况稳定，我到 02:05 都没再见到她。
      她说自己“整晚在五层”并不准确。护理站那段时间没有必须由她本人持续处理的抢救。
  - id: P4
    name: 罗安
    testimony: |
      我是夜间保安。01:48 左右，地下停车入口有人刷卡进楼。我从远处看见一个穿深色护士外套的人收起黑色折伞往员工电梯走。
      02:03 左右同一个人又从地下更衣区方向上电梯。我看不清脸，但体型和蒋组长接近。
  - id: P5
    name: 徐药师
    testimony: |
      我与何知微轮班。她前两天告诉我，五层夜间领药的补录次数异常，准备找护理组长确认。
      蒋岑曾抱怨何知微“把小事往审计上捅”。医院规定个人 PIN 不得共享，至少药师和护理主管都清楚这一点。
archive:
  - id: A1
    title: 地下药房门禁与药柜认证日志
    keywords: ["N-308", "蒋岑", "E-4", "01:51", "01:54"]
    content: |
      01:51:22，地下药房门禁使用工牌 N-308 放行；01:54:06，E-4 使用主管 PIN J-CEN-5 开柜；02:01:31，同一 PIN 再次确认关柜。
      N-308 属林可，J-CEN-5 唯一绑定蒋岑。系统允许“门禁卡持有人”和“药柜 PIN 使用人”不同，因此这是一组混合身份记录。
  - id: A2
    title: 林可下班后的外部时间记录
    keywords: ["林可", "地铁", "01:45", "N-308"]
    content: |
      林可 01:38 在医院外地铁站进闸，01:52 在列车区间发送工作群消息；她的手机基站与交通卡记录均显示当时已离开医院。
      这些记录不能解释她的工牌为何仍在院内，但能排除她本人 01:51 刷开地下药房门的可能。
  - id: A3
    title: 五层备用卡登记簿
    keywords: ["蓝点", "备用卡", "蒋岑", "林可"]
    content: |
      五层护理组有一只贴蓝点的主管备用卡套，由组长蒋岑保管。案发后该卡套主体在五层柜中，但左下角缺失一块，与药房地面的透明断角形状可拼合。
      登记簿还记载，林可工牌在案发次日清晨被发现夹在同一主管柜文件缝中。
  - id: A4
    title: 夜间领药异常审计
    keywords: ["五层", "蒋岑", "补录", "受管制药"]
    content: |
      过去六周 5 次异常补录均由 J-CEN-5 事后确认，其中 3 次对应病历没有实际使用记录。审计部门已标记为“可能存在库存转移，需人工调查”。
      何知微在案发当晚 00:42 打开过该审计页面。
truth:
  culprit: 蒋岑
  method: 蒋岑取得林可遗失的 N-308 工牌，用它刷开地下药房门以制造“实习护士到场”的假象，再用自己的主管 PIN J-CEN-5 打开 E-4；何知微正准备把连续异常领药提交审计，蒋岑在药房与其冲突并将其杀害，随后把林可工牌藏入五层主管柜并谎称一直留在病区
  key_evidence: ["S3", "P1", "P4", "A1", "A2", "A3", "A4"]
  method_required_terms: ["N-308", "J-CEN-5", "工牌", "PIN", "地下药房"]
  supporting_evidence: ["S2", "S3", "S4", "P3", "P4", "P5", "A4"]
