    content: L.W.C. 不再只是十多年前的历史联系人缩写，而是在本案发生前三天仍主动提供旧迁移账号的恢复步骤，证明该身份链至少持续活动到当前时间
    source_refs: ["S5", "A5"]
    truth_link: MASTER
  - hint_id: M14-2
    content: 当前案卷故意不提供 L.W.C. 的完整姓名；只有准确召回此前已经完成的身份解析，才能把“活跃的 L.W.C.”落到具体人物
    source_refs: ["S5", "A5"]
    truth_link: MASTER
