case_id: CASE-001
title: 雨夜剧院的空座位
briefing: |
  临江旧剧院散场后，财务主管周砚被发现死在二层票据室。剧院在 22:15 到 22:23 之间发生短时停电，
  现场最初被当作意外跌倒处理，但死者手边的壁钟、侧门泥印和钥匙记录彼此对不上。
  你需要分别勘验现场、走访人员、核对档案，最后指出凶手、作案手法和可核验的证据来源。
scene:
  - id: S1
    title: 二层票据室壁钟
    content: |
      壁钟停在 22:17。电池仍有电，后盖有新鲜撬痕，分针轴附近有手工回拨留下的细小划痕。
      地面没有因剧烈碰撞导致壁钟掉落的痕迹。
  - id: S2
    title: 侧门泥印
    content: |
      侧门内侧有一组 42 码窄人字纹鞋印。左脚鞋印后跟明显偏外磨损，右脚磨损较轻。
      泥土来自剧院后巷正在翻修的花坛。
  - id: S3
    title: 窗台火柴盒
    content: |
      窗台夹缝里有一只银灰色火柴盒，盒盖内侧刻着一枚极浅的鸦羽图案。表面没有可用指纹。
      本案现有证据不足以证明它属于任何一名嫌疑人。
npcs:
  - id: P1
    name: 许岚
    testimony: |
      我是售票员。22:10 左右，我看见舞台经理韩峥拿着一串黄铜钥匙上二楼，说要找周主管核对一张报销单。
      停电后我一直在一楼大厅，22:25 左右才又看见韩峥从侧廊方向下来。他走路时左脚有点拖。
  - id: P2
    name: 韩峥
    testimony: |
      我 21:50 就离开剧院了，停电时已经在回家路上。我没有上二楼，也不知道票据室壁钟几点停的。
      那只钟本来就经常不准，不能拿它判断时间。
  - id: P3
    name: 老沈
    testimony: |
      我是门卫。22:15 停电，备用照明到 22:23 才恢复。大约 22:21，我听见二层侧廊有金属钥匙掉在地上的声音，
      但当时看不清人影。
archive:
  - id: A1
    title: 票据室机械钥匙领用表
    keywords: [K-17, 韩峥, 钥匙]
    content: |
      票据室机械备用钥匙编号 K-17，长期领用人：舞台经理韩峥。22:19 的门禁故障日志记录：
      “电子锁掉电，机械锁芯被开启一次”。
  - id: A2
    title: 员工工装登记卡
    keywords: [韩峥, 42码, 左脚]
    content: |
      韩峥工作鞋尺码 42，鞋底纹路为窄人字纹。三年前左踝骨折，工伤复查记录注明“步态左侧轻微拖曳”。
truth:
  culprit: 韩峥
  method: 利用停电用 K-17 进入票据室杀害周砚，并手工回拨壁钟伪造更早的死亡时间
  key_evidence: [S1, P1, A1]
  method_required_terms: [停电, K-17, 回拨壁钟]
  supporting_evidence: [S2, A2, P3]
meta_plot:
  - hint_id: M1-1
    content: 窗台火柴盒刻有鸦羽图案，来源不明
    source_refs: [S3]
    truth_link: MASTER
memory_quiz:
  - id: Q1-1
    q: 第一案中票据室壁钟停在几点？
    a: "22:17"
    aliases: ["22点17分", "22时17分"]
  - id: Q1-2
    q: 第一案中票据室机械备用钥匙的编号是什么？
    a: K-17
    aliases: ["K17", "k-17", "k17"]
  - id: Q1-3
    q: 第一案现场发现的火柴盒上刻着什么图案？
    a: 鸦羽
    aliases: ["鸦羽图案", "乌鸦羽毛", "乌鸦羽毛图案"]
evaluation_targets:
  memory: [exact_fact]
  reasoning: [contradiction_resolution, evidence_synthesis]
  multi_agent: [parallel_delegate, information_isolation]
  skills: [timeline_reconstruction, cross_validation]
