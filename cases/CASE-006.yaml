case_id: CASE-006
title: 没有响过的消防铃
briefing: |
  老城区的“远汀酒店”凌晨出现厨房油烟报警，前台启动人工疏散。混乱结束后，酒店财务主管沈策被发现死在三层档案室。
  奇怪的是，三层客房区始终没有响起消防铃，三层走廊摄像头也恰好在报警前后失去画面。设施主管程泊称这是老设备故障，自己一直在地下设备间处理厨房报警。
  沈策案发前正在核对一批消防维保付款。你需要区分“真正的设备故障”和“人为隔离的报警区域”，并解释为什么没有响铃反而暴露了对消防系统最熟悉的人。
scene:
  - id: S1
    title: 三层消防分区面板
    content: |
      三层支路 Z3 显示“ISOLATE”状态，面板上的实体隔离钥匙仍插在孔内。钥匙孔周围没有破坏痕迹。
      将 Z3 隔离后，三层声光报警器不会动作，但主机仍会留下隔离与复位审计事件。普通酒店员工没有权限操作该面板。
  - id: S2
    title: 档案室门口的粉尘脚印
    content: |
      档案室外刚完成墙面打磨，地上有浅灰粉尘。门口留有一组防滑工鞋印，鞋底中央有六边形补片。
      脚印从消防楼梯方向进入，之后又返回楼梯。住客疏散主要使用客梯前厅，没有经过这段施工区。
  - id: S3
    title: 被抽出的维保付款夹
    content: |
      沈策桌边散落“消防维保 2026Q2”付款夹，其中三张发票标注已完成“Z3 声光回路更新”，但现场设备铭牌仍是五年前批次。
      一张便签写着：“明早叫程泊和供应商一起解释，先别付款。”
  - id: S4
    title: 三层摄像机弱电箱
    content: |
      摄像机本体正常，弱电箱中的三层 PoE 交换机电源被人工拔下。插头没有烧蚀或跳闸痕迹。
      交换机断电约 34 分钟后重新上电，恢复时间与酒店主机记录的 Z3 复位时间相差不到两分钟。
  - id: S5
    title: 厨房报警点
    content: |
      厨房探测器有真实油烟污染，说明 01:08 左右确实出现过一次局部烟雾事件，但灶具和线路均无火灾损坏。
      厨房属于 Z1 分区，与三层 Z3 独立；前台启动人工疏散后，未被隔离的客房分区会收到声光提示，而已处于 ISOLATE 状态的 Z3 不会动作。Z1 报警本身不会导致 Z3 自动隔离。
npcs:
  - id: P1
    name: 程泊
    testimony: |
      我是设施主管。01:05 后一直在地下设备间处理厨房误报，忙到 01:40 才上楼。老楼报警经常不响，三层摄像头掉线也很常见。
      我没进档案室，沈策查付款是财务自己的事。Z3 的隔离钥匙平时锁在设备柜里，夜班工程员也能接触。
  - id: P2
    name: 林穗
    testimony: |
      我是前台。01:09 主机显示厨房报警，人工疏散启动后别的客房层有声光提示，但三层一直没有铃声。程主管用对讲机叫我们“三层先口头疏散，别等铃”。
      01:16 我去楼梯口找他，没在地下设备间看见人。大概 01:27 他从三层消防楼梯下来，手里拿着面板钥匙，说刚去“看线路”。
  - id: P3
    name: 吴师傅
    testimony: |
      我是夜班工程员。Z3 隔离钥匙有两把，一把在主设备柜，一把由程泊随身保管。我没有动过 Z3。
      00:50 交班时三层报警回路正常，摄像头也在线。厨房探测器脏了，我原本计划白天清洗，但它和三层没有联动隔离关系。
  - id: P4
    name: 魏岑
    testimony: |
      我是保洁领班。01:20 左右在二层楼梯口碰到程泊往上走，他穿工程工鞋，右脚鞋底中间贴着一块六边形防滑补片。
      他说去三层看“是不是线路短了”。几分钟后我听到楼上有档案柜碰撞的声音，但当时大家都在疏散，没有上去。
  - id: P5
    name: 方程
    testimony: |
      我代表消防维保供应商。沈策前一天打电话问我，为什么三层回路更新发票已经结算一半，但我们公司实际只做了检测，没有更换设备。
      我查到那三张发票并不是我们正式票据格式，答应第二天到酒店核对。程泊负责酒店侧验收和付款签认。
archive:
  - id: A1
    title: 消防主机审计日志
    keywords: ["Z3", "隔离", "00:58", "01:36", "程泊"]
    content: |
      00:58:42，Z3 被人工隔离，操作员代码 ENG-01；01:08:17，Z1 厨房报警；01:36:09，Z3 恢复。
      ENG-01 绑定设施主管程泊。日志由消防主机本地写入，普通酒店业务系统不能修改。
  - id: A2
    title: 弱电机房门禁记录
    keywords: ["PoE", "摄像头", "程泊", "00:56"]
    content: |
      00:56 程泊工牌进入三层弱电间，01:38 再次刷卡进入。期间无其他工程员工刷卡。
      三层摄像机离线区间为 01:02 至 01:36，与 Z3 被隔离的主要时间段重合。
  - id: A3
    title: 消防维保付款审批
    keywords: ["程泊", "维保", "发票", "回扣"]
    content: |
      三张争议发票均由程泊提交验收，收款账户属于“远景机电服务”。该企业并非酒店合同供应商，却在过去半年收到 6 笔小额付款。
      沈策已在财务系统将后续付款标记为“冻结待核”。
  - id: A4
    title: 工程鞋领用与维修记录
    keywords: ["程泊", "工鞋", "六边形", "鞋底"]
    content: |
      程泊的工程鞋编号 E-11，上周因右脚中底开裂临时贴过六边形防滑补片，尚未更换新鞋。夜班工程员吴师傅使用的鞋底为连续横纹，无补片。
  - id: A5
    title: 远景机电历史工商扫描件
    keywords: ["远景机电", "鸦羽", "L.W.C.", "旧档"]
    content: |
      财务附件中的一份旧工商扫描件页脚带灰色鸦羽标识，并注明“历史数字化：L.W.C.”。扫描生成于多年以前，
      早于酒店本轮维保合同，不足以证明 L.W.C. 与程泊或本案死亡事件存在联系。
truth:
  culprit: 程泊
  method: 程泊提前用本人操作员代码隔离三层 Z3 并切断三层摄像机，厨房报警出现后顺势利用人工疏散造成的混乱；随后从消防楼梯进入档案室杀害准备冻结可疑维保付款的沈策，之后恢复报警分区和摄像系统并谎称一直在地下设备间
  key_evidence: ["S1", "P2", "A1", "A2"]
  method_required_terms: ["Z3", "隔离", "摄像机", "厨房报警", "消防楼梯"]
  supporting_evidence: ["S2", "S3", "S4", "S5", "P3", "P4", "P5", "A3", "A4"]
